version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tg_saas_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2026
      POSTGRES_DB: tg_saas
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tg_saas"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tg_saas_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: always

  backend:
    build: ./backend
    container_name: tg_saas_backend
    ports:
      - '4000:4000'
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://postgres:postgrespassword2026@postgres:5432/tg_saas?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=tg-saas-super-secret-jwt-key-2026
      - SESSION_ENCRYPTION_KEY=antigravity-tg-secret-32-bytes-key!
      - FRONTEND_URL=https://telexa.emt.lt
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  frontend:
    build: ./frontend
    container_name: tg_saas_frontend
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      - backend
    restart: always

  nginx:
    image: nginx:alpine
    container_name: tg_saas_nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./backend/uploads:/etc/nginx/uploads:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - backend
      - frontend
    restart: always

  certbot:
    image: certbot/certbot
    container_name: tg_saas_certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: always

volumes:
  postgres_data:
  redis_data:
  certbot_conf:
  certbot_www:

